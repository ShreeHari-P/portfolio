<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14151b" />
      <stop offset="100%" stop-color="#0a0a0f" />
    </linearGradient>
    <linearGradient id="bookGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="bookGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="bookGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="700" height="440" rx="16" fill="url(#bg3)" stroke="#23242e" stroke-width="2"/>

  <!-- Window Header -->
  <rect x="0" y="0" width="700" height="48" rx="16" fill="#191a24" stroke="#23242e" stroke-width="1"/>
  <circle cx="28" cy="24" r="6" fill="#ef4444"/>
  <circle cx="48" cy="24" r="6" fill="#eab308"/>
  <circle cx="68" cy="24" r="6" fill="#22c55e"/>
  <text x="350" y="30" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">BookHub  Full-Stack E-Commerce &amp; Chatbot Assistant</text>

  <!-- Store Navbar -->
  <g transform="translate(30, 64)">
    <rect x="0" y="0" width="640" height="42" rx="8" fill="#13141c" stroke="#262734"/>
    <text x="20" y="26" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Book<tspan fill="#6366f1">Hub</tspan></text>
    <rect x="120" y="8" width="280" height="26" rx="6" fill="#1c1e2a" stroke="#2e3042"/>
    <text x="136" y="25" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Search Java, Algorithms, System Design...</text>
    <rect x="530" y="8" width="90" height="26" rx="6" fill="#4f46e5"/>
    <text x="575" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Cart (3)</text>
  </g>

  <!-- Book Grid (Left) -->
  <g transform="translate(30, 120)">
    <!-- Book 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="125" height="180" rx="8" fill="#161822" stroke="#2a2c3d"/>
      <rect x="12" y="12" width="101" height="110" rx="6" fill="url(#bookGrad1)"/>
      <text x="62" y="60" fill="#ffffff" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">JAVA</text>
      <text x="62" y="78" fill="#fef3c7" font-family="sans-serif" font-size="9" text-anchor="middle">Complete Ref</text>
      <text x="12" y="142" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Java Masterclass</text>
      <text x="12" y="162" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12" font-weight="700">$29.99</text>
    </g>

    <!-- Book 2 -->
    <g transform="translate(138, 0)">
      <rect x="0" y="0" width="125" height="180" rx="8" fill="#161822" stroke="#2a2c3d"/>
      <rect x="12" y="12" width="101" height="110" rx="6" fill="url(#bookGrad2)"/>
      <text x="62" y="60" fill="#ffffff" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">SPRING</text>
      <text x="62" y="78" fill="#e0e7ff" font-family="sans-serif" font-size="9" text-anchor="middle">Boot 3 &amp; REST</text>
      <text x="12" y="142" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Spring In Action</text>
      <text x="12" y="162" fill="#818cf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">$34.50</text>
    </g>

    <!-- Book 3 -->
    <g transform="translate(276, 0)">
      <rect x="0" y="0" width="125" height="180" rx="8" fill="#161822" stroke="#2a2c3d"/>
      <rect x="12" y="12" width="101" height="110" rx="6" fill="url(#bookGrad3)"/>
      <text x="62" y="60" fill="#ffffff" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">DATA</text>
      <text x="62" y="78" fill="#d1fae5" font-family="sans-serif" font-size="9" text-anchor="middle">Structures &amp; Alg</text>
      <text x="12" y="142" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Algorithms 4th</text>
      <text x="12" y="162" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">$39.00</text>
    </g>

    <!-- Bottom Feature Badges -->
    <g transform="translate(0, 196)">
      <rect x="0" y="0" width="401" height="74" rx="8" fill="#13151f" stroke="#252737"/>
      <text x="18" y="28" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">DATABASE ARCHITECTURE</text>
      <text x="18" y="52" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Relational Inventory | ACID Orders | Auth Tokens</text>
    </g>
  </g>

  <!-- Chatbot Assistant Widget (Right) -->
  <g transform="translate(446, 120)">
    <rect x="0" y="0" width="224" height="270" rx="10" fill="#151722" stroke="#4338ca" stroke-width="1.5"/>
    
    <!-- Chat Header -->
    <rect x="0" y="0" width="224" height="38" rx="10" fill="#1e2030"/>
    <circle cx="20" cy="19" r="6" fill="#22c55e"/>
    <text x="34" y="23" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">BookBot AI Assistant</text>

    <!-- Chat Messages -->
    <rect x="12" y="50" width="160" height="34" rx="8" fill="#282a3c"/>
    <text x="22" y="71" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">Need a recommendation for Java?</text>

    <rect x="52" y="94" width="160" height="34" rx="8" fill="#4f46e5"/>
    <text x="62" y="115" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10">Yes! Looking for Spring Boot.</text>

    <rect x="12" y="138" width="190" height="48" rx="8" fill="#282a3c"/>
    <text x="22" y="157" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">"Spring in Action 6th Edition"</text>
    <text x="22" y="173" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="10">is in stock. Added discount code!</text>

    <!-- Chat Input -->
    <rect x="12" y="224" width="200" height="34" rx="6" fill="#1c1e2a" stroke="#313449"/>
    <text x="24" y="246" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Type your question...</text>
    <circle cx="196" cy="241" r="9" fill="#4f46e5"/>
    <text x="196" y="245" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">&#10148;</text>
  </g>
</svg>
