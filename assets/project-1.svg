    <rect x="360" y="116" width="88" height="8" rx="4" fill="url(#accent1)"/>
    <text x="470" y="124" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="12" font-weight="600">88%</text>

    <rect x="520" y="111" width="86" height="22" rx="11" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-opacity="0.3"/>
    <text x="563" y="126" fill="#4ade80" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Synced Sheets</text>

    <!-- Row 3 -->
    <line x1="16" y1="150" x2="624" y2="150" stroke="#27272a"/>
    <circle cx="36" cy="176" r="14" fill="#06b6d4"/>
    <text x="36" y="181" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">RD</text>
    <text x="60" y="176" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Rahul David</text>
    <text x="60" y="189" fill="#71717a" font-family="system-ui, sans-serif" font-size="10">rahul.d@domain.com</text>
    <text x="200" y="180" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="12">Python / ML Intern</text>
    
    <!-- Progress bar 3 -->
    <rect x="360" y="172" width="100" height="8" rx="4" fill="#27272a"/>
    <rect x="360" y="172" width="82" height="8" rx="4" fill="url(#accent1)"/>
    <text x="470" y="180" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="12" font-weight="600">82%</text>

    <rect x="520" y="167" width="86" height="22" rx="11" fill="#eab308" fill-opacity="0.15" stroke="#eab308" stroke-opacity="0.3"/>
    <text x="563" y="182" fill="#facc15" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Processing AI</text>
  </g>
</svg>
