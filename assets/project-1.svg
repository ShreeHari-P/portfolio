    <rect x="0" y="0" width="195" height="74" rx="10" fill="#1c1917" stroke="#2e2e33"/>
    <text x="16" y="26" fill="#71717a" font-family="system-ui, sans-serif" font-size="11">TOTAL CANDIDATES</text>
    <text x="16" y="56" fill="#fafafa" font-family="system-ui, sans-serif" font-size="22" font-weight="700">1,248</text>
    <rect x="135" y="20" width="46" height="20" rx="6" fill="#22c55e" fill-opacity="0.2"/>
    <text x="158" y="34" fill="#4ade80" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">+18%</text>

    <!-- Metric 2 -->
    <rect x="222" y="0" width="195" height="74" rx="10" fill="#1c1917" stroke="#2e2e33"/>
    <text x="238" y="26" fill="#71717a" font-family="system-ui, sans-serif" font-size="11">PARSING ACCURACY</text>
    <text x="238" y="56" fill="#fafafa" font-family="system-ui, sans-serif" font-size="22" font-weight="700">98.4%</text>
    <rect x="362" y="20" width="42" height="20" rx="6" fill="#3b82f6" fill-opacity="0.2"/>
    <text x="383" y="34" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">AI-LLM</text>

    <!-- Metric 3 -->
