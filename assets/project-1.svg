    <text x="460" y="26" fill="#71717a" font-family="system-ui, sans-serif" font-size="11">SHEETS SYNC</text>
    <text x="460" y="56" fill="#fafafa" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Real-time</text>
    <circle cx="615" cy="37" r="6" fill="#22c55e"/>
  </g>

  <!-- Candidate Ranking Table Preview -->
