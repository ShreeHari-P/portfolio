    <text x="24" y="24" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11" font-weight="600">CANDIDATE</text>
    <text x="200" y="24" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11" font-weight="600">TARGET ROLE</text>
    <text x="360" y="24" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11" font-weight="600">AI MATCH SCORE</text>
