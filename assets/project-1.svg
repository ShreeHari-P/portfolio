    <circle cx="36" cy="64" r="14" fill="#3b82f6"/>
    <text x="36" y="69" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">AK</text>
    <text x="60" y="64" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Arun Kumar</text>
    <text x="60" y="77" fill="#71717a" font-family="system-ui, sans-serif" font-size="10">arun.k@domain.com</text>
