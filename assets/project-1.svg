    <text x="470" y="68" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="12" font-weight="600">94%</text>

    <rect x="520" y="55" width="86" height="22" rx="11" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-opacity="0.3"/>
    <text x="563" y="70" fill="#4ade80" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Synced Sheets</text>

    <!-- Row 2 -->
    <line x1="16" y1="94" x2="624" y2="94" stroke="#27272a"/>
    <circle cx="36" cy="120" r="14" fill="#8b5cf6"/>
    <text x="36" y="125" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">PS</text>
    <text x="60" y="120" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Pooja Sharma</text>
    <text x="60" y="133" fill="#71717a" font-family="system-ui, sans-serif" font-size="10">pooja.s@domain.com</text>
    <text x="200" y="124" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="12">Full Stack Engineer</text>
    
    <!-- Progress bar 2 -->
