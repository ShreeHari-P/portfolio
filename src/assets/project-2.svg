<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15171c" />
      <stop offset="100%" stop-color="#0b0d11" />
    </linearGradient>
    <linearGradient id="spamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="hamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="700" height="440" rx="16" fill="url(#bg2)" stroke="#272a30" stroke-width="2"/>

  <!-- Window Header -->
  <rect x="0" y="0" width="700" height="48" rx="16" fill="#1b1e24" stroke="#272a30" stroke-width="1"/>
  <circle cx="28" cy="24" r="6" fill="#ef4444"/>
  <circle cx="48" cy="24" r="6" fill="#eab308"/>
  <circle cx="68" cy="24" r="6" fill="#22c55e"/>
  <text x="350" y="30" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="middle">NLP Machine Learning - Spam Classifier &amp; Analytics</text>
  <rect x="560" y="14" width="110" height="20" rx="10" fill="#282d37"/>
  <text x="615" y="28" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Naive Bayes / TF-IDF</text>

  <!-- Left Column: Input Simulator -->
  <g transform="translate(30, 68)">
    <rect x="0" y="0" width="370" height="340" rx="12" fill="#12141a" stroke="#232730"/>
    <text x="20" y="30" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Live Message Testing</text>
    
    <!-- Input Box -->
    <rect x="20" y="50" width="330" height="110" rx="8" fill="#1a1d26" stroke="#2f3542"/>
    <text x="32" y="76" fill="#f87171" font-family="monospace" font-size="12">"URGENT: Congratulations! You won</text>
    <text x="32" y="96" fill="#f87171" font-family="monospace" font-size="12">a $10,000 cash prize. Click here</text>
    <text x="32" y="116" fill="#f87171" font-family="monospace" font-size="12">to claim immediately -> http://..."</text>

    <!-- Prediction Result Alert -->
    <rect x="20" y="176" width="330" height="84" rx="10" fill="#7f1d1d" fill-opacity="0.25" stroke="#ef4444" stroke-opacity="0.4"/>
    <circle cx="48" cy="218" r="16" fill="#ef4444" fill-opacity="0.2"/>
    <text x="48" y="223" fill="#ef4444" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle">!</text>
    <text x="76" y="208" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="15" font-weight="700">CLASSIFIED AS: SPAM</text>
    <text x="76" y="230" fill="#f87171" font-family="system-ui, sans-serif" font-size="12">Confidence Probability: 99.2%</text>

    <!-- Preprocessing Tokens -->
    <text x="20" y="286" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11" font-weight="600">EXTRACTED TF-IDF TOKENS:</text>
    <rect x="20" y="296" width="60" height="20" rx="6" fill="#232732"/>
    <text x="50" y="310" fill="#d1d5db" font-family="monospace" font-size="10" text-anchor="middle">urgent</text>
    <rect x="88" y="296" width="56" height="20" rx="6" fill="#232732"/>
    <text x="116" y="310" fill="#d1d5db" font-family="monospace" font-size="10" text-anchor="middle">prize</text>
    <rect x="152" y="296" width="56" height="20" rx="6" fill="#232732"/>
    <text x="180" y="310" fill="#d1d5db" font-family="monospace" font-size="10" text-anchor="middle">claim</text>
    <rect x="216" y="296" width="70" height="20" rx="6" fill="#232732"/>
    <text x="251" y="310" fill="#d1d5db" font-family="monospace" font-size="10" text-anchor="middle">congrat</text>
  </g>

  <!-- Right Column: Model Stats & Matrix -->
  <g transform="translate(420, 68)">
    <rect x="0" y="0" width="250" height="340" rx="12" fill="#12141a" stroke="#232730"/>
    <text x="20" y="30" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Model Evaluation</text>

    <!-- Stat 1 -->
    <rect x="20" y="50" width="210" height="56" rx="8" fill="#1a1d26" stroke="#282d38"/>
    <text x="34" y="74" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">MODEL ACCURACY</text>
    <text x="34" y="96" fill="#10b981" font-family="system-ui, sans-serif" font-size="18" font-weight="700">97.8%</text>

    <!-- Stat 2 -->
    <rect x="20" y="118" width="210" height="56" rx="8" fill="#1a1d26" stroke="#282d38"/>
    <text x="34" y="142" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">F1-SCORE (SPAM)</text>
    <text x="34" y="164" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="18" font-weight="700">0.964</text>

    <!-- Confusion Matrix Card -->
    <rect x="20" y="188" width="210" height="136" rx="8" fill="#1a1d26" stroke="#282d38"/>
    <text x="34" y="210" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">CONFUSION MATRIX</text>
    
    <rect x="34" y="224" width="80" height="40" rx="4" fill="#10b981" fill-opacity="0.2"/>
    <text x="74" y="244" fill="#34d399" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">TP: 948</text>
    <text x="74" y="258" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Legit Ham</text>

    <rect x="122" y="224" width="80" height="40" rx="4" fill="#ef4444" fill-opacity="0.2"/>
    <text x="162" y="244" fill="#f87171" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">FP: 12</text>
    <text x="162" y="258" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">False Alarm</text>

    <rect x="34" y="272" width="80" height="40" rx="4" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="74" y="292" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">FN: 8</text>
    <text x="74" y="306" fill="#fde68a" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Missed</text>

    <rect x="122" y="272" width="80" height="40" rx="4" fill="#10b981" fill-opacity="0.2"/>
    <text x="162" y="292" fill="#34d399" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">TN: 382</text>
    <text x="162" y="306" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">True Spam</text>
  </g>
</svg>
